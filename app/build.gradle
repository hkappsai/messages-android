plugins {
    id 'com.android.application'
}

// GIF search uses the Giphy web API. Put GIPHY_API_KEY=... in local.properties to turn it on.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def giphyKey = localProps.getProperty('GIPHY_API_KEY', '')

android {
    namespace 'co.hkapps.messages'
    compileSdk 34

    defaultConfig {
        applicationId 'co.hkapps.messages'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "4.0"
        buildConfigField "String", "GIPHY_API_KEY", "\"${giphyKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No dependencies: the app uses only the Android framework.
