plugins {
    id 'com.android.application'
}

android {
    namespace 'co.hkapps.messages'
    compileSdk 34

    defaultConfig {
        applicationId 'co.hkapps.messages'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No dependencies: the app uses only the Android framework.
